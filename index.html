<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<script src="/api/config"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16191f">
<title>LOCK-IN HQ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase-status.js"></script>
<script src="scripts/supabase-auth.js"></script>
<script src="scripts/backup-data.js"></script>
<script src="scripts/cloud-sync.js"></script>
<script src="scripts/force-save.js"></script>
<script src="scripts/integrations-data.js"></script>
<script src="scripts/auto-sync.js"></script>
<script src="scripts/google-calendar-service.js"></script>
<script src="scripts/sync-status-line.js"></script>
<script src="scripts/lockin-data.js"></script>
<link rel="stylesheet" href="styles/lock-in.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>LOCK-IN HQ</h1>
      <p class="date" id="todayLabel"></p>
    </div>
    <button type="button" class="more-btn" id="moreBtn" aria-expanded="false" aria-controls="moreMenu">More</button>
  </header>

  <div class="card menu" id="moreMenu" hidden>
    <a href="pages/second-brain.html">Second Brain <span class="tag">Notes</span></a>
    <a href="pages/assistant.html">Assistant <span class="tag">Morning · Evening · Weekly</span></a>
    <a href="pages/content.html">Content <span class="tag">Captions · Stories</span></a>
    <a href="#" class="soon-link">Workforce <span class="tag">Not built yet</span></a>
    <div class="group">Existing pages</div>
    <a href="pages/main.html">Full To Do list</a>
    <a href="command-centre.html">Command Centre (old home)</a>
    <a href="pages/daily-snapshot.html">Daily Control Panel</a>
    <a href="pages/ai-ceo.html">AI CEO (prompt builder)</a>
    <a href="pages/integrations.html">Integrations &amp; Cloud Sync</a>
  </div>

  <section aria-labelledby="commitH">
    <h2 id="commitH">Today's commitments</h2>
    <div class="card commit"><ul class="plain" id="commitList"></ul></div>
  </section>

  <section aria-labelledby="focusH">
    <h2 id="focusH">Main action</h2>
    <div id="mainSlot"></div>
  </section>

  <section aria-labelledby="supportH" id="supportSection">
    <h2 id="supportH">Supporting</h2>
    <div id="supportSlot"></div>
  </section>

  <section aria-labelledby="dumpH">
    <h2 id="dumpH"><label for="dumpInput" style="margin:0;color:inherit;font-size:inherit">Brain dump</label></h2>
    <form class="card" id="dumpForm" autocomplete="off">
      <textarea id="dumpInput" placeholder="Anything on your mind — get it out of your head." maxlength="500"></textarea>
      <div class="row"><button type="submit" class="primary" id="dumpBtn">Capture</button></div>
      <p class="status" id="dumpStatus" role="status" aria-live="polite"></p>
    </form>
    <details id="inboxDetails">
      <summary id="inboxSummary"></summary>
      <ul class="plain inbox" id="inboxList"></ul>
    </details>
  </section>

  <p class="status" id="actionStatus" role="status" aria-live="polite"></p>
  <p class="sync-line" id="syncLine"></p>
</div>

<script>
(function () {
  'use strict';

  var TZ = 'Europe/London';
  var L = window.LockIn;
  var editingId = null;
  var lastActionAt = '';

  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function hm(iso) {
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
  }
  function dayMonth(iso) {
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: TZ });
  }
  function setStatus(node, kind, msg, undo) {
    node.className = 'status' + (kind ? ' ' + kind : '');
    node.textContent = msg || '';
    if (undo) node.appendChild(el('button', { type: 'button', text: 'Undo', onclick: undo }));
  }

  // ---------- Commitments ----------
  // Real events only from the app's own Google Calendar integration
  // (OAuth tokens + /api routes). Mock/demo events are never shown here.
  var cal = { state: 'not-connected', events: [], at: '', error: '' };

  function readCalendar() {
    var gc = window.Integrations ? window.Integrations.load().googleCalendar : null;
    var connected = !!(gc && gc.enabled && window.GoogleCalendarService && window.GoogleCalendarService.isConnected());
    if (!connected) { cal = { state: 'not-connected', events: [], at: '', error: '' }; return null; }
    // Cache counts only if it came from a real fetch (status exactly 'Connected').
    var real = gc.status === 'Connected' && gc.lastSync;
    cal = {
      state: 'loading',
      events: real ? window.GoogleCalendarService.getToday(gc.upcomingEvents) : [],
      at: real ? gc.lastSync : '',
      error: '',
    };
    return gc;
  }

  async function refreshCalendar() {
    if (!readCalendar()) { renderCommitments(); return; }
    renderCommitments();
    var cached = { events: cal.events, at: cal.at };
    var res = await window.GoogleCalendarService.refresh('googleCalendar');
    if (res.ok) {
      var gc = res.state.googleCalendar;
      cal = { state: 'fresh', events: window.GoogleCalendarService.getToday(gc.upcomingEvents), at: gc.lastSync, error: '' };
    } else {
      cal = { state: 'failed', events: cached.events, at: cached.at, error: res.error || 'unknown error' };
    }
    renderCommitments();
  }

  function routineItems() {
    var r = L.SUPPLIED_ROUTINE;
    var items = [];
    var today = L.activeDate();
    var dow = new Date(today + 'T12:00:00').getDay();
    if (r.weekdayWork.days.indexOf(dow) !== -1) {
      items.push({ time: r.weekdayWork.start + '–' + r.weekdayWork.end, text: r.weekdayWork.label });
    }
    r.dates.forEach(function (d) {
      var diff = Math.round((new Date(d.date + 'T12:00:00') - new Date(today + 'T12:00:00')) / 864e5);
      if (diff >= 0 && diff <= 14) {
        items.push({ time: diff === 0 ? 'Today' : dayMonth(d.date + 'T12:00:00'), text: d.label + (diff > 0 ? ' — in ' + diff + ' day' + (diff === 1 ? '' : 's') : '') });
      }
    });
    return items;
  }

  function renderCommitments() {
    var ul = $('commitList');
    ul.textContent = '';

    // Calendar (retrieved)
    var head;
    if (cal.state === 'not-connected') {
      ul.appendChild(el('li', {}, [
        el('span', { text: 'Calendar ' }), el('span', { class: 'tag', text: 'Not connected' }),
        el('span', { class: 'src' }, ['Connect Google Calendar in ', el('a', { href: 'pages/integrations.html', text: 'Integrations' }), ' to see real events here.']),
      ]));
    } else {
      if (cal.state === 'loading') head = 'Refreshing calendar…';
      else if (cal.state === 'fresh') head = 'From Google Calendar · retrieved ' + hm(cal.at);
      else head = 'Refresh failed' + (cal.at ? ' · showing events retrieved ' + dayMonth(cal.at) + ' ' + hm(cal.at) : ' · no cached events');
      ul.appendChild(el('li', {}, [el('span', { class: 'src' + (cal.state === 'failed' ? ' tag err' : ''), text: head })]));
      if (cal.state === 'failed') ul.lastChild.title = cal.error;
      if (cal.events.length) {
        cal.events.forEach(function (e) {
          ul.appendChild(el('li', {}, [el('span', { class: 'time', text: e.time || 'All day' }), e.title]));
        });
      } else if (cal.at && cal.state !== 'loading') {
        ul.appendChild(el('li', { class: 'empty', text: 'No calendar events today.' }));
      }
    }

    // Email — no email integration exists in the app.
    ul.appendChild(el('li', {}, [
      el('span', { text: 'Email ' }), el('span', { class: 'tag', text: 'Not connected' }),
      el('span', { class: 'src', text: 'The app has no email integration yet.' }),
    ]));

    // Supplied routine (not retrieved)
    var routine = routineItems();
    if (routine.length) {
      ul.appendChild(el('li', {}, [el('span', { class: 'src', text: 'Your usual routine — supplied by you, not from a calendar' })]));
      routine.forEach(function (r) {
        ul.appendChild(el('li', {}, [el('span', { class: 'time', text: r.time }), r.text]));
      });
    }
  }

  // ---------- Actions ----------
  function run(fn, statusNode, okMsg, undo) {
    var res = fn();
    if (res.ok) {
      lastActionAt = new Date().toISOString();
      setStatus(statusNode || $('actionStatus'), 'ok', okMsg, undo);
    } else {
      setStatus(statusNode || $('actionStatus'), 'err', res.error);
    }
    render();
    renderSync();
    return res;
  }

  function snapshot() { return JSON.parse(JSON.stringify(L.loadToday())); }

  function doComplete(item) {
    var before = snapshot();
    run(function () { return L.complete(item.id, true); }, null, 'Saved — marked done.', function () {
      run(function () { return L.restoreToday(before); }, null, 'Saved — undone.');
    });
  }
  function doDefer(item) {
    var before = snapshot();
    run(function () { return L.defer(item.id); }, null, 'Saved — moved to tomorrow.', function () {
      run(function () {
        var r = L.restoreToday(before);
        return r.ok ? L.removeFromTomorrow(item.id) : r;
      }, null, 'Saved — back on today.');
    });
  }
  function doRole(item, role, msg) { run(function () { return L.setRole(item.id, role); }, null, msg); }

  function editForm(item) {
    var status = el('p', { class: 'status', role: 'status', 'aria-live': 'polite' });
    var name = el('input', { id: 'ed-text', value: item.text, maxlength: '200' });
    var step = el('input', { id: 'ed-step', value: item.firstStep || '', maxlength: '200', placeholder: 'e.g. Open the quote template' });
    var mins = el('select', { id: 'ed-min' });
    [['0', 'Not set'], ['10', '10 min'], ['15', '15 min'], ['25', '25 min'], ['45', '45 min'], ['60', '1 hour'], ['90', '1½ hours'], ['120', '2 hours']].forEach(function (o) {
      var opt = el('option', { value: o[0], text: o[1] });
      if (Number(o[0]) === (Number(item.minutes) || 0)) opt.selected = true;
      mins.appendChild(opt);
    });
    var form = el('form', { autocomplete: 'off' }, [
      el('label', { for: 'ed-text', text: 'Action' }), name,
      el('label', { for: 'ed-step', text: 'First concrete step' }), step,
      el('label', { for: 'ed-min', text: 'Realistic time' }), mins,
      el('div', { class: 'row' }, [
        el('button', { type: 'submit', class: 'primary', text: 'Save' }),
        el('button', { type: 'button', text: 'Cancel', onclick: function () { editingId = null; render(); } }),
      ]),
      status,
    ]);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var res = L.update(item.id, { text: name.value, firstStep: step.value, minutes: mins.value });
      if (!res.ok) { setStatus(status, 'err', res.error); return; } // inputs keep their values
      editingId = null;
      lastActionAt = new Date().toISOString();
      setStatus($('actionStatus'), 'ok', 'Saved.');
      render();
      renderSync();
    });
    return form;
  }

  function actionCard(item, isMain) {
    var card = el('div', { class: 'card ' + (isMain ? 'main-card' : 'support') });
    if (editingId === item.id) { card.appendChild(editForm(item)); return card; }
    card.appendChild(el('p', { class: 'title', text: item.text }));
    card.appendChild(item.firstStep
      ? el('p', { class: 'meta' }, [el('strong', { text: 'First step: ' }), item.firstStep])
      : el('p', { class: 'meta missing', text: 'No first step yet — tap Edit to add one.' }));
    card.appendChild(el('p', { class: 'meta', text: item.minutes ? 'About ' + (item.minutes >= 60 ? (item.minutes / 60) + ' h' : item.minutes + ' min') : 'Time not set' }));
    card.appendChild(el('div', { class: 'row' }, [
      el('button', { type: 'button', class: isMain ? 'primary' : '', text: 'Done', onclick: function () { doComplete(item); } }),
      el('button', { type: 'button', text: 'Defer', title: 'Move to tomorrow', onclick: function () { doDefer(item); } }),
      el('button', { type: 'button', text: 'Edit', onclick: function () { editingId = item.id; render(); var f = $('ed-step'); if (f) f.focus(); } }),
    ]));
    return card;
  }

  function render() {
    var f = L.focus(L.loadToday());

    var mainSlot = $('mainSlot');
    mainSlot.textContent = '';
    if (f.main) mainSlot.appendChild(actionCard(f.main, true));
    else mainSlot.appendChild(el('div', { class: 'card' }, [el('p', { class: 'empty', text:
      f.inbox.length ? 'No main action chosen. Open "Captured" below and tap Make main on one item.'
                     : 'Nothing chosen yet. Capture what matters below, then make one item your main action.' }),
      el('p', { class: 'meta', style: 'margin-top:8px' }, ['Or let the ', el('a', { href: 'pages/assistant.html', text: 'Assistant suggest a plan' }), '.'])]));

    var supportSlot = $('supportSlot');
    supportSlot.textContent = '';
    f.support.forEach(function (s) { supportSlot.appendChild(actionCard(s, false)); });
    $('supportSection').hidden = f.support.length === 0;

    var inbox = $('inboxList');
    inbox.textContent = '';
    $('inboxSummary').textContent = 'Captured today · ' + f.inbox.length + (f.done.length ? ' · ' + f.done.length + ' done' : '');
    $('inboxDetails').hidden = f.inbox.length === 0 && f.done.length === 0;
    f.inbox.forEach(function (item) {
      var supportFull = f.support.length >= L.MAX_SUPPORT;
      inbox.appendChild(el('li', {}, [
        el('span', { text: item.text }),
        el('div', { class: 'row' }, [
          el('button', { type: 'button', text: 'Make main', onclick: function () { doRole(item, 'main', 'Saved — now your main action.'); } }),
          supportFull ? null : el('button', { type: 'button', text: 'Supporting', onclick: function () { doRole(item, 'support', 'Saved — added as supporting.'); } }),
          el('button', { type: 'button', text: 'Done', onclick: function () { doComplete(item); } }),
          el('button', { type: 'button', text: 'Defer', onclick: function () { doDefer(item); } }),
        ]),
      ]));
    });
  }

  // ---------- Brain dump ----------
  $('dumpForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('dumpInput');
    var btn = $('dumpBtn');
    btn.disabled = true;
    var res = L.capture(input.value);
    btn.disabled = false;
    if (res.ok) {
      input.value = '';
      lastActionAt = new Date().toISOString();
      setStatus($('dumpStatus'), 'ok', 'Saved to today\'s list.');
      render();
      renderSync();
    } else {
      setStatus($('dumpStatus'), 'err', res.error); // input kept as typed
    }
  });

  // ---------- Sync line (honest about where data lives) ----------
  function renderSync() { $('syncLine').textContent = window.SyncStatusLine.text(lastActionAt); }

  // ---------- More menu ----------
  $('moreBtn').addEventListener('click', function () {
    var m = $('moreMenu');
    m.hidden = !m.hidden;
    this.setAttribute('aria-expanded', String(!m.hidden));
  });
  Array.prototype.forEach.call(document.querySelectorAll('.soon-link'), function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      setStatus($('actionStatus'), '', a.firstChild.textContent.trim() + ' is planned for a later stage — see docs/LOCK_IN_HQ.md.');
    });
  });

  // ---------- Boot ----------
  $('todayLabel').textContent = new Date(L.activeDate() + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  render();
  refreshCalendar();
  if (window.AutoSync) window.AutoSync.subscribe(renderSync);
  renderSync();
  window.addEventListener('storage', function (e) { if (e.key && e.key.indexOf('goals:') === 0 && !editingId) render(); });
})();
</script>
</body>
</html>
